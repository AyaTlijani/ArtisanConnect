vich_uploader:
    db_driver: orm
    storage: file_system
    mappings:
        atelier_image:
            uri_prefix: /uploads/ateliers
            upload_destination: '%images_directory%/ateliers'
            namer: Vich\UploaderBundle\Naming\OrignameNamer
        
        produit_image:
            uri_prefix: /uploads/produits
            upload_destination: '%images_directory%/produits'
            namer: Vich\UploaderBundle\Naming\OrignameNamer
